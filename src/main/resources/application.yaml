spring:
  application:
    name: blog-springboot

  datasource:
    url: jdbc:sqlite:data/blog.db
    driver-class-name: org.sqlite.JDBC

  jpa:
    database-platform: org.hibernate.community.dialect.SQLiteDialect
    hibernate:
      ddl-auto: update
    show-sql: false

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

  jackson:
    default-property-inclusion: non_null

app:
  jwt:
    secret: blog-x-secret-key-change-in-production-must-be-at-least-256-bits
    access-token-expiration: 7200000
    refresh-token-expiration: 604800000
  upload:
    path: ./data/uploads
  site:
    url: http://localhost:8080
