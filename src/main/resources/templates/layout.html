<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${title} + ' | X-Blog'">X-Blog</title>
    <link rel="stylesheet" href="/style.css">
    <th:block th:replace="~{fragments/head :: head}"></th:block>
</head>
<body>

<header class="header">
    <a href="/" class="logo">X-<span>Blog</span></a>
    <nav>
        <a href="/">首页</a>
        <a href="/search">搜索</a>
        <th:block th:if="${session.user} == null">
            <a href="/login">登录</a>
            <a href="/register">注册</a>
        </th:block>
        <th:block th:if="${session.user} != null">
            <a href="/profile">个人中心</a>
            <th:block th:if="${session.user.role == 'ADMIN' or session.user.role == 'AUTHOR'}">
                <a href="/admin">管理后台</a>
            </th:block>
            <a href="/logout">退出</a>
        </th:block>
    </nav>
</header>

<div class="container" style="margin-top: 24px;">
    <th:block th:replace="~{::content}"></th:block>
</div>

</body>
</html>
