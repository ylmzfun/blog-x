<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{admin-layout :: html(content=~{::content}, title='数据统计', menu='stats')}">
<th:block th:fragment="content">

    <h1 class="page-title">数据统计</h1>

    <div class="stats-row">
        <div class="stat-card">
            <div class="num" th:text="${stats.postCount}">0</div>
            <div class="label">文章总数</div>
        </div>
        <div class="stat-card">
            <div class="num" th:text="${stats.commentCount}">0</div>
            <div class="label">评论总数</div>
        </div>
        <div class="stat-card">
            <div class="num" th:text="${stats.userCount}">0</div>
            <div class="label">用户总数</div>
        </div>
        <div class="stat-card">
            <div class="num" th:text="${stats.todayPV}">0</div>
            <div class="label">今日 PV</div>
        </div>
    </div>

    <div class="card">
        <h3 style="margin-bottom: 16px;">文章阅读量排行榜 TOP 10</h3>
        <div th:if="${#lists.isEmpty(topPosts)}" style="color:var(--text-muted);">暂无数据</div>
        <table class="table" th:if="${not #lists.isEmpty(topPosts)}">
            <thead>
                <tr>
                    <th>#</th>
                    <th>标题</th>
                    <th>阅读量</th>
                    <th>评论数</th>
                    <th>发布时间</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="post,iterStat : ${topPosts}">
                    <td th:text="${iterStat.index + 1}">1</td>
                    <td><a th:href="@{/post/{slug}(slug=${post.slug})}" th:text="${post.title}">Title</a></td>
                    <td th:text="${post.viewCount}">0</td>
                    <td th:text="${post.commentCount}">0</td>
                    <td th:text="${#temporals.format(post.publishedAt, 'yyyy-MM-dd')}">-</td>
                </tr>
            </tbody>
        </table>
    </div>

</th:block>
</html>
