<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: html(content=~{::content}, title='搜索：' + ${keyword})}">
<th:block th:fragment="content">

    <h1 class="page-title">搜索结果：[[${keyword}]]</h1>

    <form action="/search" method="get" style="margin-bottom: 24px;">
        <div class="header" style="position:static;background:transparent;border:none;padding:0;height:auto;">
            <div class="search-box">
                <input type="text" name="q" th:value="${keyword}" placeholder="搜索文章..." style="width:300px;">
                <button type="submit">搜索</button>
            </div>
        </div>
    </form>

    <div th:each="item : ${results.list}" class="card post-card">
        <h2><a th:href="@{/post/{slug}(slug=${item.slug})}" th:utext="${item.highlight}">Title</a></h2>
        <p class="summary" th:if="${item.summary}" th:text="${item.summary}">Summary</p>
    </div>

    <div th:if="${#lists.isEmpty(results.list)}" style="text-align:center;padding:60px 0;color:var(--text-muted);">
        未找到相关文章
    </div>

    <th:block th:replace="~{fragments/pagination :: pagination(
        baseUrl=@{/search(q=${keyword})}, page=${results.page}, totalPages=${pages})}"></th:block>

</th:block>
</html>
