<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: html(content=~{::content}, title='个人中心')}">
<th:block th:fragment="content">

    <div class="card" style="max-width: 600px; margin: 0 auto;">
        <h1 class="page-title">个人中心</h1>

        <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>
        <div th:if="${error}" class="alert alert-error" th:text="${error}"></div>

        <!-- Profile Form -->
        <form action="/profile" method="post">
            <div class="form-group">
                <label>用户名</label>
                <input type="text" name="username" th:value="${user.username}" required>
            </div>
            <div class="form-group">
                <label>邮箱</label>
                <input type="email" th:value="${user.email}" disabled>
            </div>
            <div class="form-group">
                <label>个人简介</label>
                <textarea name="bio" th:text="${user.bio}" rows="3"></textarea>
            </div>
            <div class="form-group">
                <label>网站</label>
                <input type="text" name="website" th:value="${user.website}" placeholder="https://...">
            </div>
            <div class="form-group">
                <label>头像 URL</label>
                <input type="text" name="avatar" th:value="${user.avatar}" placeholder="头像图片链接">
            </div>
            <button type="submit" class="btn btn-primary">保存修改</button>
        </form>

        <!-- Change Password -->
        <hr style="margin: 32px 0; border-color: var(--border);">
        <h3>修改密码</h3>
        <form action="/profile/password" method="post" style="margin-top: 16px;">
            <div class="form-group">
                <label>旧密码</label>
                <input type="password" name="oldPassword" required>
            </div>
            <div class="form-group">
                <label>新密码</label>
                <input type="password" name="newPassword" required placeholder="至少6位">
            </div>
            <button type="submit" class="btn btn-primary">修改密码</button>
        </form>
    </div>

</th:block>
</html>
